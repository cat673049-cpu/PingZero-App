name: Build PingZero EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install PyInstaller
      run: pip install pyinstaller

    - name: Build EXE
      run: pyinstaller --noconfirm --onefile --windowed --uac-admin PingZeroApp.py

    - name: Upload EXE
      uses: actions/upload-artifact@v3
      with:
        name: PingZero-Windows-App
        path: dist/PingZeroApp.exe
